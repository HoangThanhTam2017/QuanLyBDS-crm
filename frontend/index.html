<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8e0b2c">
  <meta name="description" content="Đăng nhập hệ thống quản lý bất động sản nội bộ của Công ty cổ phần Thành Tâm Hà Tĩnh">
  <title>Đăng nhập · Thành Tâm Hà Tĩnh</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=password-toggle">
  <style>
    #login-form .password-group > .form-control {
      height: 2.85rem;
      border: 1px solid #e5e7eb;
      border-right: 0;
      border-radius: 0.8rem 0 0 0.8rem;
      background: #f9fafb;
      font-size: 0.95rem;
      box-shadow: none;
    }
    #login-form .password-group > .form-control:focus {
      background: #fff;
      border-color: #155cc0;
      box-shadow: 0 0 0 4px rgba(21, 92, 192, 0.13);
    }
    #login-form #togglePassword.btn {
      width: auto;
      height: 2.85rem;
      margin: 0;
      padding: 0 0.95rem;
      border: 1px solid #e5e7eb;
      border-radius: 0 0.8rem 0.8rem 0;
      background: #fff;
      color: #6c757d;
      box-shadow: none;
    }
    #login-form #togglePassword.btn:hover {
      background: #f3f4f6;
      color: #155cc0;
      border-color: #e5e7eb;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#8e0b2c",
            secondary: "#155cc0",
            canvas: "#f3f4f6"
          },
          fontFamily: {
            sans: ["Inter", "Roboto", "Segoe UI", "sans-serif"]
          }
        }
      }
    };
  </script>
  <script src="assets/js/auth.js?v=password-toggle"></script>
</head>
<body>
  <section id="login-screen">
    <div class="login-card">
      <div class="h-1.5 bg-[#8e0b2c]"></div>
      <div class="px-6 py-9 sm:px-10">
        <img class="logo-img" src="assets/images/logo.png" alt="Logo Thành Tâm Hà Tĩnh">
        <p class="mt-5 text-center text-[11px] font-bold uppercase tracking-[0.18em] text-[#8e0b2c]">Nội bộ</p>
        <h1 class="mt-2 text-center text-xl font-bold leading-snug text-gray-900">Công ty cổ phần Thành Tâm Hà Tĩnh</h1>
        <p class="mt-2 text-center text-sm text-gray-500">Hệ thống quản lý bất động sản</p>

        <form id="login-form" class="mt-8" novalidate>
          <div>
            <label class="label" for="email">Email</label>
            <div class="field">
              <i class="fa-solid fa-envelope field-icon" aria-hidden="true"></i>
              <input id="email" name="email" type="email" class="input input-icon" placeholder="ten@thanhtam.vn" autocomplete="username" inputmode="email" spellcheck="false">
            </div>
          </div>
          <div>
            <label class="label" for="passwordInput">Mật khẩu</label>
            <div class="input-group mb-3 password-group">
              <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Hiện mật khẩu" aria-pressed="false">
                <i class="fas fa-eye" id="eyeIcon" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <p id="login-error" class="form-error is-hidden" role="alert"></p>
          <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>
        <p class="mt-6 text-center text-xs leading-relaxed text-gray-400">Tài khoản do phòng hành chính cấp. Chỉ dùng cho cán bộ, nhân viên nội bộ.</p>
      </div>
    </div>
  </section>
  <noscript>
    <p style="padding:1rem;font-family:sans-serif">Vui lòng bật JavaScript để đăng nhập và sử dụng hệ thống.</p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.getElementById("togglePassword").addEventListener("click", function () {
      var passwordInput = document.getElementById("passwordInput");
      var eyeIcon = document.getElementById("eyeIcon");
      var visible = passwordInput.type === "password";
      if (visible) {
        passwordInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
      this.setAttribute("aria-label", visible ? "Ẩn mật khẩu" : "Hiện mật khẩu");
      this.setAttribute("aria-pressed", visible ? "true" : "false");
    });
  </script>
</body>
</html>
